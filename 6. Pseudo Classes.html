<!DOCTYPE HTML>
<html>
    <head>
        <title>7. Demo</title>
        <link rel="stylesheet" href="6. style.css">
    </head>
    <body>  
        <h1>Pseudo Classes</h1>
        <h3>1. Input Fields</h3>
        <input type="text" placeholder="Enter your name"><br><br>
        <input type="text" value="Disabled Field" disabled readonly><br><br>
        <input type="number" placeholder="Age" min="18" max="30" required><br><br>
        <input type="email" placeholder="Enter your Email">
        <br><br>

        <input type="checkbox"> I have a Car<br>
        <input type="checkbox"> I have a Bike<br>
        

        <h3>2. Paragraphs</h3>
        <p></p>
        <p>This is a paragraph.</p>

        <h3>3. Div tags</h3>

         <p class="A1">DIV 1</p>
        <p class="A1">DIV 2</p>

        <div>
            <p class="A1">DIV 3</p>
            <p class="A1">DIV 4</p>
        </div>

        <h3>3. Language Pseudo</h3>
        <p lang="en">This is English</p>
        <p lang="tur">Bu bir Türkçe paragraph</p>
        <p lang="urd"> ye urdu hai</p>

        <h3>4. Target Pseudo</h3>
        <a href="#id">Link to Target</a>

        <div id="id">
            <p>This is the target element</p>
        </div>



       

    </body>
</html>
